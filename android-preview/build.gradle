plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.aureliorm.meucontrole'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aureliorm.meucontrole.preview'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '1.3.0-beta'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['build/web-assets']
        }
    }
}
