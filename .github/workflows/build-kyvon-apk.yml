name: Gerar APK KYVON

on:
  push:
    branches: [main]
    paths:
      - 'App.tsx'
      - 'src/**'
      - 'server/ayla/**'
      - 'docs/AYLA.md'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'ci/**'
      - '.github/workflows/build-kyvon-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'App.tsx'
      - 'src/**'
      - 'server/ayla/**'
      - 'docs/AYLA.md'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'ci/**'
      - '.github/workflows/build-kyvon-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run export:web
      - run: node --check server/ayla/index.mjs
      - run: node --test server/ayla/index.test.mjs

  build-apk:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Testar recuperação dos dados
        run: npm run test:unit

      - name: Verificar exportação web
        run: npm run export:web

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gerar projeto Android NATIVO
        run: npx expo prebuild --platform android --clean --no-install

      # assembleRelease embeds the JavaScript/Hermes bundle in the APK.
      # A debug APK would depend on a Metro server and fail on users' phones.
      - name: Compilar APK autonomo com JS integrado
        run: cd android && ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Copiar APK
        run: |
          mkdir -p output
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          cp "$APK" output/KYVON-beta.apk
          ls -lh output/KYVON-beta.apk

      - name: Validar integridade e JavaScript integrado ao APK
        run: |
          set -eu
          test -s output/KYVON-beta.apk
          unzip -t output/KYVON-beta.apk >/dev/null
          unzip -Z -1 output/KYVON-beta.apk | grep -q '^assets/index.android.bundle$'
          test "$(stat -c%s output/KYVON-beta.apk)" -gt 5000000
          echo "APK autonomo validado: pacote ZIP integro e bundle React Native incluso"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: KYVON-beta-apk
          path: output/KYVON-beta.apk
          if-no-files-found: error

      - name: Publicar beta para download
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kyvon-beta-v1.7.1
          name: KYVON beta v1.7.1 (Android nativo)
          body: 'KYVON com Ayla: conversa, histórico e assistente financeiro com confirmação de ações. IA geral requer serviço autenticado. JavaScript/Hermes integrado; dispensa servidor Metro e WebView. Versão de desenvolvimento, não publicada na Play Store. Se já tiver APK assinado com outra chave, desinstale a versão antiga antes de instalar.'
          prerelease: true
          files: output/KYVON-beta.apk
          fail_on_unmatched_files: true
